name = "imgstore-api"
main = "src/index.ts"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "*"
APP_URL = "https://imgstore-web.xlabaryai.workers.dev"

# Cloudflare KV binding for image metadata & user sessions
[[kv_namespaces]]
binding = "IMGSTORE_META"
id = "5050ace356c642158ef8cd2a593283b7"
preview_id = "07593d07464f46a6862f4d6f2f715457"

# Cloudflare Durable Objects bindings for Resumable Uploads & Client Quota
[durable_objects]
bindings = [
  { name = "UPLOAD_SESSION_DO", class_name = "UploadSessionDO" },
  { name = "CLIENT_QUOTA_DO", class_name = "ClientQuotaDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UploadSessionDO", "ClientQuotaDO"]

# Cloudflare Images binding: edge image conversion (env.IMAGES).
# Requires the Images product on the account; without it the capability
# endpoint reports images.available = false and the UI hides the action.
[images]
binding = "IMAGES"
