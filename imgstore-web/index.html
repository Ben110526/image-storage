<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ImgStore — Cloud Media Hosting &amp; Instant CDN</title>
    <!-- Fonts: system stack only (plan §7.1) — no webfont requests. -->
  </head>
  <body>
    <!--
      Appearance bootstrap — runs BEFORE first paint so there is no theme flash.
      R7: this is the ES5 inline transcription of src/design/appearanceShared.ts
      (parseAppearance/resolveTheme/loadAppearance) — the SINGLE validation &
      migration implementation both sides share. Keep the two in lockstep; the
      React provider re-derives the identical values from the same functions so
      the post-hydration state always matches the pre-paint one. Default for a
      fresh install is LIGHT (plan §7); a stored 'system' choice is preserved.
      Any storage failure falls back to light defaults without crashing the app.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        // --- transcribed from appearanceShared.ts (parseAppearance/resolveTheme) ---
        var pref = { theme: 'light', glassTint: 60, reduceTransparency: false, reduceMotion: false };
        try {
          var raw = localStorage.getItem('imgstore_appearance_v1');
          if (raw) {
            var p = JSON.parse(raw);
            if (p && typeof p === 'object') {
              if (p.theme === 'light' || p.theme === 'dark' || p.theme === 'system') pref.theme = p.theme;
              var t = Number(p.glassTint);
              if (isFinite(t)) pref.glassTint = Math.min(100, Math.max(0, Math.round(t)));
              pref.reduceTransparency = p.reduceTransparency === true;
              pref.reduceMotion = p.reduceMotion === true;
            }
          } else {
            var legacy = localStorage.getItem('imgstore_theme');
            if (legacy === 'light' || legacy === 'dark') {
              pref.theme = legacy;
              try {
                localStorage.setItem('imgstore_appearance_v1', JSON.stringify({ version: 1, theme: legacy, glassTint: 60, reduceTransparency: false, reduceMotion: false }));
                localStorage.removeItem('imgstore_theme');
              } catch (e) {}
            }
          }
        } catch (e) {}

        var osDark = false, osRM = false, osRT = false;
        try {
          osDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          osRM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          osRT = window.matchMedia('(prefers-reduced-transparency: reduce)').matches;
        } catch (e) {}

        var resolved = pref.theme === 'system' ? (osDark ? 'dark' : 'light') : pref.theme;
        root.setAttribute('data-theme', resolved);
        root.setAttribute('data-transparency', (pref.reduceTransparency || osRT) ? 'reduced' : 'full');
        root.setAttribute('data-motion', (pref.reduceMotion || osRM) ? 'reduced' : 'full');
        root.style.setProperty('--glass-tint', (pref.glassTint / 100).toFixed(3));
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
